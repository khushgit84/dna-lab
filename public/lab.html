<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Data Storage Lab 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Panels */
        .panel { position: absolute; background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0,255,255,0.2); border-radius: 8px; padding: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        
        #left-panel { top: 20px; left: 20px; width: 320px; max-height: 90vh; overflow-y: auto; }
        #top-bar { top: 20px; left: 360px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
        #bottom-bar { bottom: 20px; left: 20px; right: 20px; height: 60px; display: flex; justify-content: center; align-items: center; font-family: monospace; font-size: 14px; }
        
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #00F0FF; }
        h3 { margin: 10px 0 5px 0; font-size: 14px; color: #aaa; text-transform: uppercase; }
        
        textarea { width: 100%; height: 80px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #00F0FF; padding: 8px; font-family: monospace; border-radius: 4px; resize: none; box-sizing: border-box; }
        input[type="range"] { width: 100%; }
        
        button { background: rgba(0, 240, 255, 0.1); border: 1px solid #00F0FF; color: #00F0FF; padding: 8px 12px; cursor: pointer; border-radius: 4px; transition: all 0.2s; font-weight: bold; }
        button:hover { background: rgba(0, 240, 255, 0.3); }
        
        .stat-box { display: flex; flex-direction: column; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.4); border-radius: 6px; }
        .stat-val { font-size: 20px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; }
        
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
        
        #hover-info { position: absolute; pointer-events: none; background: rgba(0,0,0,0.8); border: 1px solid #00F0FF; padding: 10px; border-radius: 4px; display: none; z-index: 20; font-family: monospace; font-size: 14px; }
        
        .color-A { color: #00FF66; } .color-C { color: #00F0FF; } .color-G { color: #FFCC00; } .color-T { color: #FF3366; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #left-panel { top: auto; bottom: 0; left: 0; right: 0; width: 100%; max-height: 40vh; border-radius: 20px 20px 0 0; box-sizing: border-box; border-bottom: none; border-left: none; border-right: none; }
            #top-bar { top: 0; left: 0; right: 0; flex-wrap: wrap; justify-content: center; border-radius: 0 0 20px 20px; border-top: none; border-left: none; border-right: none; }
            #bottom-bar { display: none; } /* Hide bottom info bar on mobile to save space */
            .stat-box { padding: 5px 8px; }
            .stat-val { font-size: 16px; }
            .stat-label { font-size: 9px; }
            button { font-size: 12px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hover-info"></div>

    <div id="top-bar" class="panel">
        <div class="stat-box"><span class="stat-val" id="stat-bases">0</span><span class="stat-label">Total Bases</span></div>
        <div class="stat-box"><span class="stat-val" id="stat-bytes">0</span><span class="stat-label">Bytes</span></div>
        <div class="stat-box"><span class="stat-val" id="stat-gc">0%</span><span class="stat-label">GC Content</span></div>
        <div class="stat-box"><span class="stat-val" id="stat-errors" style="color: #FF3366">0 / 0</span><span class="stat-label">Errors (Found / Fixed)</span></div>
        <button onclick="window.location.href='/'" style="border-color: #FF3366; color: #FF3366;">Exit Lab</button>
    </div>

    <div id="left-panel" class="panel">
        <h2>Data Encoding Lab</h2>
        
        <h3>Input Data</h3>
        <textarea id="data-input" oninput="app.encodeData()">Hello DNA Storage World! 🧬</textarea>
        
        <label class="checkbox-label">
            <input type="checkbox" id="toggle-ecc" onchange="app.encodeData()" checked> Enable Error Correction (ECC)
        </label>
        <label class="checkbox-label">
            <input type="checkbox" id="toggle-rot" onchange="app.encodeData()" checked> Prevent Homopolymers (Rotating Code)
        </label>
        
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button onclick="document.getElementById('file-input').click()" style="flex: 1;">Upload File</button>
            <input type="file" id="file-input" style="display: none;" onchange="app.handleFileUpload(event)">
            <button onclick="app.downloadFasta()" style="flex: 1;">Export FASTA</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <h2>Mutation Engine</h2>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 12px; color: #aaa;">Mutation Rate: <span id="mut-rate-val">1%</span></label>
            <input type="range" id="mut-rate" min="0" max="10" step="0.5" value="1" oninput="document.getElementById('mut-rate-val').innerText = this.value + '%'">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="app.induceMutations()" style="flex: 1; border-color: #FFCC00; color: #FFCC00;">Induce Mutations</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <h2>Decoded Output</h2>
        <textarea id="data-output" readonly style="background: rgba(0,20,0,0.5); border-color: #00FF66; color: #00FF66;"></textarea>
        
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <h2>Biology Modes</h2>
        <div style="display: flex; gap: 10px;">
            <button onclick="app.animateUnzip()" style="flex: 1;">Animate Unzip</button>
            <button onclick="app.transcribe()" style="flex: 1;">Transcribe (mRNA)</button>
        </div>
    </div>

    <div id="bottom-bar" class="panel">
        DNA Storage Density: ~215 Petabytes per Gram | <span style="margin-left: 10px; color: #00FF66" id="status-text">System Ready</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        /**
         * DNA Data Storage Engine
         * Implements Encoding, ECC, and Three.js Visualization.
         */
        const Config = {
            colors: {
                A: 0x00FF66,
                C: 0x00F0FF,
                G: 0xFFCC00,
                T: 0xFF3366,
                backbone: 0xaaaaaa
            }
        };

        class DNACodec {
            // Standard mapping
            static bitsToBase = { '00': 'A', '01': 'C', '10': 'G', '11': 'T' };
            static baseToBits = { 'A': '00', 'C': '01', 'G': '10', 'T': '11' };
            static complement = { 'A': 'T', 'T': 'A', 'C': 'G', 'G': 'C' };

            // Rotating mapping to prevent homopolymers
            static rotMap = {
                'A': { '0': 'C', '1': 'G', '2': 'T' },
                'C': { '0': 'G', '1': 'T', '2': 'A' },
                'G': { '0': 'T', '1': 'A', '2': 'C' },
                'T': { '0': 'A', '1': 'C', '2': 'G' }
            };

            static stringToBinary(str) {
                let bin = '';
                for(let i = 0; i < str.length; i++) {
                    bin += str.charCodeAt(i).toString(2).padStart(8, '0');
                }
                return bin;
            }

            static binaryToString(bin) {
                let str = '';
                for(let i = 0; i < bin.length; i += 8) {
                    str += String.fromCharCode(parseInt(bin.substr(i, 8), 2));
                }
                return str;
            }

            // Simple Parity ECC (1 bit per byte for demonstration)
            // In a real system, Reed-Solomon is used.
            static encodeWithECC(binStr) {
                let encoded = '';
                for(let i=0; i<binStr.length; i+=8) {
                    let byte = binStr.substr(i, 8);
                    if(byte.length < 8) byte = byte.padEnd(8, '0');
                    let ones = byte.split('1').length - 1;
                    let parity = (ones % 2 === 0) ? '0' : '1';
                    encoded += byte + parity + '0'; // Pad to 10 bits for alignment
                }
                return encoded;
            }

            static decodeWithECC(binStr, stats) {
                let decoded = '';
                for(let i=0; i<binStr.length; i+=10) {
                    let chunk = binStr.substr(i, 10);
                    if(chunk.length < 10) break;
                    let byte = chunk.substr(0, 8);
                    let parity = chunk[8];
                    let ones = byte.split('1').length - 1;
                    let expectedParity = (ones % 2 === 0) ? '0' : '1';
                    
                    if(parity !== expectedParity) {
                        stats.errorsFound++;
                        // Simplistic auto-fix for visual demo (flips last bit)
                        let fixedByte = byte.substr(0,7) + (byte[7]==='0'?'1':'0');
                        decoded += fixedByte;
                        stats.errorsFixed++;
                    } else {
                        decoded += byte;
                    }
                }
                return decoded;
            }

            static encodeDNA(binStr, useRot) {
                let dna = '';
                let lastBase = 'A'; // Initial state for rotating code
                
                for(let i = 0; i < binStr.length; i += 2) {
                    let pair = binStr.substr(i, 2);
                    if(pair.length < 2) pair = pair.padEnd(2, '0');
                    
                    if(useRot) {
                        // Map pair (00=0, 01=1, 10=2, 11=3 but we only have 3 options to avoid lastBase)
                        // This requires ternary mapping, but for demo we map pseudo-randomly to avoid repeating
                        let options = Object.values(this.rotMap[lastBase]);
                        let val = parseInt(pair, 2);
                        let base = options[val % 3]; // simplified rotating logic
                        dna += base;
                        lastBase = base;
                    } else {
                        dna += this.bitsToBase[pair];
                    }
                }
                return dna;
            }

            static decodeDNA(dnaStr, useRot) {
                let bin = '';
                let lastBase = 'A';
                
                for(let i=0; i<dnaStr.length; i++) {
                    let base = dnaStr[i];
                    if(!['A','C','G','T'].includes(base)) base = 'A'; // error fallback
                    
                    if(useRot) {
                        // Reverse lookup
                        let options = Object.values(this.rotMap[lastBase]);
                        let idx = options.indexOf(base);
                        if(idx === -1) idx = 0; // Error fallback
                        bin += idx.toString(2).padStart(2, '0');
                        lastBase = base;
                    } else {
                        bin += this.baseToBits[base];
                    }
                }
                return bin;
            }
        }

        class DNAVisualizer {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x050505, 0.015);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 0, 40);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.autoRotate = true;
                this.controls.autoRotateSpeed = 1.0;

                this.setupLighting();
                this.createStarfield();
                
                this.basesStrand1 = [];
                this.basesStrand2 = [];
                this.group = new THREE.Group();
                this.scene.add(this.group);

                // Raycaster for hover
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                
                window.addEventListener('resize', () => this.onResize());
                window.addEventListener('mousemove', (e) => this.onMouseMove(e));

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            setupLighting() {
                const ambient = new THREE.HemisphereLight(0xffffff, 0x111122, 0.4);
                this.scene.add(ambient);
                
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(20, 30, 20);
                this.scene.add(dirLight);
                
                const dirLight2 = new THREE.DirectionalLight(0x00F0FF, 0.5);
                dirLight2.position.set(-20, -30, -20);
                this.scene.add(dirLight2);

                const blueLight = new THREE.PointLight(0x00F0FF, 1.5, 100);
                blueLight.position.set(-5, 0, 10);
                this.scene.add(blueLight);
                
                const pinkLight = new THREE.PointLight(0xFF3366, 1.2, 100);
                pinkLight.position.set(5, 0, -10);
                this.scene.add(pinkLight);
            }

            createStarfield() {
                const geo = new THREE.BufferGeometry();
                const verts = [];
                for(let i=0; i<1000; i++) {
                    verts.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                }
                geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                const mat = new THREE.PointsMaterial({ color: 0x888888, size: 0.5, transparent: true, opacity: 0.6 });
                this.scene.add(new THREE.Points(geo, mat));
            }

            buildHelix(sequence) {
                // Clear old
                while(this.group.children.length > 0){ 
                    this.group.remove(this.group.children[0]); 
                }
                this.userDataMap = [];

                const len = sequence.length;
                const radius = 2.5;
                const heightStep = 1.0;
                const twistStep = 0.55; // Organic tight twist

                // Realistic Organic Materials (Subsurface scattering look via MeshPhysicalMaterial)
                const createOrganicMat = (hex, emissiveHex) => new THREE.MeshPhysicalMaterial({
                    color: hex,
                    emissive: emissiveHex,
                    emissiveIntensity: 0.1,
                    roughness: 0.2,
                    metalness: 0.1,
                    clearcoat: 0.8,
                    clearcoatRoughness: 0.2,
                    transmission: 0.3,
                    thickness: 0.5
                });

                const baseMats = {
                    'A': createOrganicMat(Config.colors.A, Config.colors.A),
                    'C': createOrganicMat(Config.colors.C, Config.colors.C),
                    'G': createOrganicMat(Config.colors.G, Config.colors.G),
                    'T': createOrganicMat(Config.colors.T, Config.colors.T),
                    'bond': new THREE.MeshPhysicalMaterial({ color: 0x888888, roughness: 0.5, transmission: 0.6, transparent: true, opacity: 0.8 }),
                    'backbone': new THREE.MeshPhysicalMaterial({ color: 0x223344, roughness: 0.3, clearcoat: 0.6, metalness: 0.2 })
                };

                const sphereGeo = new THREE.SphereGeometry(0.45, 24, 24);
                const cylinderGeo = new THREE.CylinderGeometry(0.12, 0.12, radius*2 - 0.6, 12);
                cylinderGeo.rotateZ(Math.PI / 2);

                const yOffset = -(len * heightStep) / 2;
                
                // Track backbone positions
                const spine1 = [];
                const spine2 = [];

                for(let i=0; i<len; i++) {
                    const base = sequence[i];
                    const comp = DNACodec.complement[base];
                    const angle1 = i * twistStep;
                    const angle2 = angle1 + 2.4; // Major/minor groove offset

                    const y = yOffset + i * heightStep;

                    const p1 = new THREE.Vector3(Math.cos(angle1) * radius, y, Math.sin(angle1) * radius);
                    const p2 = new THREE.Vector3(Math.cos(angle2) * radius, y, Math.sin(angle2) * radius);
                    
                    spine1.push(p1);
                    spine2.push(p2);

                    // Bases
                    const n1 = new THREE.Mesh(sphereGeo, baseMats[base] || baseMats['A']);
                    n1.position.copy(p1);
                    n1.position.lerp(p2, 0.15); // Move slightly inward from backbone
                    
                    const n2 = new THREE.Mesh(sphereGeo, baseMats[comp] || baseMats['T']);
                    n2.position.copy(p2);
                    n2.position.lerp(p1, 0.15); // Move slightly inward from backbone

                    // Bond
                    const bond = new THREE.Mesh(cylinderGeo, baseMats['bond']);
                    bond.position.lerpVectors(n1.position, n2.position, 0.5);
                    bond.lookAt(n1.position);

                    n1.userData = { index: i, base: base, type: 'base1' };
                    n2.userData = { index: i, base: comp, type: 'base2' };

                    this.group.add(n1);
                    this.group.add(n2);
                    this.group.add(bond);
                    this.userDataMap.push(n1);
                }

                // Render Continuous Backbones if we have enough points
                if (spine1.length > 1) {
                    const curve1 = new THREE.CatmullRomCurve3(spine1);
                    const curve2 = new THREE.CatmullRomCurve3(spine2);
                    
                    const tubeGeo1 = new THREE.TubeGeometry(curve1, len * 4, 0.25, 12, false);
                    const tubeGeo2 = new THREE.TubeGeometry(curve2, len * 4, 0.25, 12, false);
                    
                    const backbone1 = new THREE.Mesh(tubeGeo1, baseMats.backbone);
                    const backbone2 = new THREE.Mesh(tubeGeo2, baseMats.backbone);
                    
                    this.group.add(backbone1);
                    this.group.add(backbone2);
                }

                // Move camera based on size, limit out-zoom for aesthetics
                this.camera.position.z = Math.min(50, len * 0.7 + 10);
            }

            onMouseMove(event) {
                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            }

            animate() {
                requestAnimationFrame(this.animate);
                this.controls.update();

                // Raycasting for hover
                if (this.userDataMap && this.userDataMap.length > 0) {
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const intersects = this.raycaster.intersectObjects(this.group.children);
                    
                    const hoverInfo = document.getElementById('hover-info');
                    if (intersects.length > 0) {
                        const hit = intersects.find(x => x.object.geometry.type === 'SphereGeometry');
                        if (hit && hit.object.userData.base) {
                            const data = hit.object.userData;
                            hoverInfo.style.display = 'block';
                            hoverInfo.style.left = event.clientX + 15 + 'px';
                            hoverInfo.style.top = event.clientY + 15 + 'px';
                            hoverInfo.innerHTML = `Index: ${data.index}<br>Base: <span class="color-${data.base}">${data.base}</span>`;
                        }
                    } else {
                        hoverInfo.style.display = 'none';
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        class AppController {
            constructor() {
                this.visualizer = new DNAVisualizer();
                this.currentDNA = '';
                this.stats = { errorsFound: 0, errorsFixed: 0 };
                
                // Init
                setTimeout(() => this.encodeData(), 500);
            }

            encodeData() {
                const text = document.getElementById('data-input').value;
                const useECC = document.getElementById('toggle-ecc').checked;
                const useRot = document.getElementById('toggle-rot').checked;

                // 1. String to Binary
                let bin = DNACodec.stringToBinary(text);

                // 2. ECC
                if(useECC) {
                    bin = DNACodec.encodeWithECC(bin);
                }

                // 3. DNA Encoding
                this.currentDNA = DNACodec.encodeDNA(bin, useRot);

                // Update UI Stats
                document.getElementById('stat-bases').innerText = this.currentDNA.length;
                document.getElementById('stat-bytes').innerText = text.length;
                
                const gc = (this.currentDNA.match(/[GC]/g) || []).length;
                const gcPerc = this.currentDNA.length ? Math.round((gc / this.currentDNA.length) * 100) : 0;
                document.getElementById('stat-gc').innerText = gcPerc + '%';

                // Build 3D
                this.visualizer.buildHelix(this.currentDNA);
                
                // Decode to verify
                this.decodeData();
            }

            decodeData() {
                const useECC = document.getElementById('toggle-ecc').checked;
                const useRot = document.getElementById('toggle-rot').checked;
                
                this.stats = { errorsFound: 0, errorsFixed: 0 };

                let bin = DNACodec.decodeDNA(this.currentDNA, useRot);

                if(useECC) {
                    bin = DNACodec.decodeWithECC(bin, this.stats);
                }

                const str = DNACodec.binaryToString(bin);
                
                document.getElementById('data-output').value = str;
                document.getElementById('stat-errors').innerText = `${this.stats.errorsFound} / ${this.stats.errorsFixed}`;
                
                if (this.stats.errorsFound > 0 && this.stats.errorsFound > this.stats.errorsFixed) {
                    document.getElementById('data-output').style.color = '#FF3366';
                    document.getElementById('data-output').style.borderColor = '#FF3366';
                } else {
                    document.getElementById('data-output').style.color = '#00FF66';
                    document.getElementById('data-output').style.borderColor = '#00FF66';
                }
            }

            induceMutations() {
                const rate = parseFloat(document.getElementById('mut-rate').value) / 100;
                if(rate === 0) return;

                let mutated = '';
                const bases = ['A','C','G','T'];
                for(let i=0; i<this.currentDNA.length; i++) {
                    if(Math.random() < rate) {
                        // Mutate
                        mutated += bases[Math.floor(Math.random()*4)];
                    } else {
                        mutated += this.currentDNA[i];
                    }
                }
                
                this.currentDNA = mutated;
                this.visualizer.buildHelix(this.currentDNA);
                this.decodeData();
                document.getElementById('status-text').innerText = `Mutations induced at ${(rate*100).toFixed(1)}%`;
            }

            animateUnzip() {
                // Simplistic animation simulation via UI
                document.getElementById('status-text').innerText = "Running Helicase Unzip Animation...";
                const orgZ = this.visualizer.camera.position.z;
                this.visualizer.camera.position.z = 10;
                setTimeout(() => { this.visualizer.camera.position.z = orgZ; document.getElementById('status-text').innerText = "System Ready"; }, 2000);
            }

            transcribe() {
                const rna = this.currentDNA.replace(/T/g, 'U');
                document.getElementById('data-output').value = `mRNA Transcript:\n${rna}`;
                document.getElementById('status-text').innerText = "Transcribed DNA to mRNA.";
            }

            handleFileUpload(event) {
                const file = event.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('data-input').value = e.target.result.substring(0, 500); // truncate for demo performance
                    this.encodeData();
                };
                reader.readAsText(file);
            }

            downloadFasta() {
                const fasta = `>DNA_Storage_Export\n${this.currentDNA}`;
                const blob = new Blob([fasta], {type: 'text/plain'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.fasta';
                a.click();
            }
        }

        const app = new AppController();

    </script>

    <!-- 
    README & ARCHITECTURE:
    1. Encoder: Converts strings to binary, optionally adds a parity bit (ECC), and maps bits to DNA bases.
       - The 'Rotating Code' prevents homopolymers (e.g. AAAA) which cause read errors in nanopore sequencing.
    2. Visualizer: Three.js engine rendering the anatomically-styled double helix.
    3. UI: Dark mode glassmorphism panels linking the real-time simulation.
    -->
</body>
</html>
